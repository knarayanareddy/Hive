# fly.toml — Hive single-machine deployment (NOT applied; owner's go-ahead required).
# Reference: https://fly.io/docs/reference/configuration/
app = "hive"
primary_region = "ams"   # change to taste; Utrecht-adjacent

[build]
  dockerfile = "Dockerfile"

[env]
  HIVE_DB_PATH = "/data/live.db"
  HIVE_ARTIFACT_DIR = "/data/artifacts"
  HIVE_STATIC_DIR = "/app/dist"
  NODE_ENV = "production"
  # Secrets are set out-of-band, never here:
  #   fly secrets set HIVE_ADMIN_TOKEN=... HIVE_MASTER_KEY=$(openssl rand -base64 32)
  #   (+ HIVE_GITHUB_REPO/HIVE_GITHUB_TOKEN, HIVE_SLACK_WEBHOOK_URL, webhook secrets)

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false   # single-writer SQLite: never autostop to zero
  auto_start_machines = true
  min_machines_running = 1     # exactly one machine — single-writer kernel

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "hive_data"
  destination = "/data"
  initial_size = "1gb"

# Rollback: `fly releases` → `fly deploy --image <previous>` (or redeploy git tag).
