name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test   # 12 specs: 10 chaos acceptance + 2 integration (mock GitHub/Slack on 127.0.0.1)

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify FORCE RLS + default-deny as non-superuser role (throwaway db)
        run: node scripts/verify-postgres-rls.mjs
        env:
          HIVE_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
