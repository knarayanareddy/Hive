name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test   # 32 specs: 10 chaos acceptance + kernel/unit + session/authz/webhooks/custody + streams/outbox/artifacts/SDK

  ui-e2e:
    runs-on: ubuntu-latest
    env:
      HIVE_E2E_ADMIN_TOKEN: e2e-ci-admin-token-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start single-origin gateway (background)
        run: |
          HIVE_ADMIN_TOKEN="$HIVE_E2E_ADMIN_TOKEN" HIVE_ENABLE_DEV_DRILLS=1 \
            node --no-warnings --import tsx src/server/index.ts > gateway.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          echo "gateway failed to start"; cat gateway.log; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify FORCE RLS + default-deny as non-superuser role (throwaway db)
        run: node scripts/verify-postgres-rls.mjs
        env:
          HIVE_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
